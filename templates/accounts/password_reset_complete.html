{% extends "base.html" %}
{% load i18n static %}

{% block extra_head %}

  <link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}
<article class="qm-frame qm-faq qm-auth">
  <header class="qm-faq__head">
    <h1 class="qm-title">{% trans "Пароль змінено" %}</h1>
  </header>
  <div class="qm-faq__panel">
    <a class="qm-btn qm-btn--primary qm-btn--block" href="{% url 'accounts:login' %}">{% trans "Увійти" %}</a>
  </div>
</article>
{% endblock %}
