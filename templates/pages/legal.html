{% extends "base.html" %}
{% load i18n static %}

{% block extra_head %}
  <link rel="stylesheet" href="{% static 'css/faq.css' %}">
  <link rel="stylesheet" href="{% static 'css/legal.css' %}">
{% endblock %}

{% block content %}
<article class="qm-frame qm-faq qm-legal">
  <header class="qm-faq__head">
    <h1 class="qm-title">{{ page_title }}</h1>
    {% if page_lead %}
      <p class="qm-faq__lead">{{ page_lead }}</p>
    {% endif %}
  </header>

  <div class="qm-faq__panel">
    <div class="qm-legal__doc">
      <div class="qm-legal__text qm-legal__html">{{ legal_body|safe }}</div>
    </div>

    <a class="qm-btn qm-btn--primary qm-btn--block" href="{% url 'pages:contacts' %}">{% trans "Контакти" %}</a>
    <a class="qm-btn qm-btn--ghost qm-btn--block" href="{% url legal_alt_url %}">{{ legal_alt_label }}</a>
  </div>
</article>
{% endblock %}
